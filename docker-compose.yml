services:
  postgres:
    image: postgres:17-alpine
    container_name: nexxclinic-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexxclinic}
      POSTGRES_USER: ${POSTGRES_USER:-nexxclinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexxclinic_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexxclinic_user} -d ${POSTGRES_DB:-nexxclinic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: nexxclinic-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-nexxclinic_meili_master_key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${MEILI_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  meilisearch_data: