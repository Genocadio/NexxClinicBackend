services:
  postgres:
    image: postgres:17-alpine
    container_name: nexxclinic-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexxclinic}
      POSTGRES_USER: ${POSTGRES_USER:-nexxclinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexxclinic_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexxclinic_user} -d ${POSTGRES_DB:-nexxclinic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
