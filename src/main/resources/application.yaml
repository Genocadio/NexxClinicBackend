spring:
  application:
    name: nexxclinic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexxclinic}
    username: ${DB_USER:nexxclinic_user}
    password: ${DB_PASSWORD:nexxclinic_pass}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match
      # what the migrations created (see src/main/resources/db/migration/).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Existing databases (previously managed by ddl-auto=update) have no
    # flyway_schema_history: baseline them at V1 so only V2+ run there.
    # Fresh databases run V1 (full schema) and then V2+.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  graphql:
    schema:
      file-extensions: .graphqls, .gqls
    graphiql:
      enabled: true
meilisearch:
  url: ${MEILI_URL:http://localhost:7700}
  api-key: ${MEILI_MASTER_KEY:nexxclinic_meili_master_key}
  # Disable to make product/patient/worker search use the database exclusively.
  enabled: ${MEILI_ENABLED:true}

supabase:
  url: https://supa.med.rw
  service-key: SECRET
  bucket-public: uploads-public
  bucket-private: uploads-private
  # Bucket for generated invoice PDFs; created automatically on first use.
  bucket-invoices: ${SUPABASE_BUCKET_INVOICES:data}
  # Storage HTTP client hardening: fail fast instead of hanging on slow/unhealthy
  # Supabase, and survive transient (429/5xx) blips with bounded backoff.
  connect-timeout-ms: ${SUPABASE_CONNECT_TIMEOUT_MS:5000}
  request-timeout-ms: ${SUPABASE_REQUEST_TIMEOUT_MS:15000}
  retry-max-attempts: ${SUPABASE_RETRY_MAX_ATTEMPTS:2}
  retry-backoff-ms: ${SUPABASE_RETRY_BACKOFF_MS:500}

logging:
  level:
    root: INFO
    com.nexxserve.nexxclinic: DEBUG
    com.nexxserve.nexxclinic.auth: DEBUG
    com.nexxserve.nexxclinic.security: DEBUG
    com.nexxserve.nexxclinic.config: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/nexxclinic.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  password:
    history-count: ${PASSWORD_HISTORY_COUNT:5}
