spring:
  datasource:
    url: jdbc:postgresql://db:5432/nexxclinic
    username: nexxclinic_user
    password: nexxclinic_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO