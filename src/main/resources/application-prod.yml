server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:5000}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD_MS:10000}

  jpa:
    hibernate:
      # Flyway owns the schema. If an existing database (built incrementally by
      # ddl-auto=update) has drift that makes Hibernate validate fail at boot,
      # run ONCE with SPRING_JPA_HIBERNATE_DDL_AUTO=update to reconcile, then
      # switch back to validate. Remove any lingering SPRING_JPA_HIBERNATE_DDL_AUTO
      # env var from old deployments so validate stays in effect.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  graphql:
    schema:
      file-extensions: .graphqls, .gqls
      # Disable introspection in production to prevent schema leaking
      introspection:
        enabled: false
    graphiql:
      enabled: false

  lifecycle:
    # Give in-flight requests (PDF renders, etc.) time to finish on shutdown
    timeout-per-shutdown-phase: 30s

billing:
  invoice:
    paper-size: ${INVOICE_PAPER_SIZE:letter}
    signed-url-expiry-seconds: ${INVOICE_SIGNED_URL_EXPIRY:300}

meilisearch:
  url: ${MEILI_URL:http://localhost:7700}
  api-key: ${MEILI_MASTER_KEY}
  enabled: ${MEILI_ENABLED:true}

supabase:
  storage-type: ${STORAGE_TYPE:LOCAL}
  url: ${SUPABASE_URL:http://localhost:8000}
  service-key: ${SUPABASE_SERVICE_KEY:YOUR_SERVICE_ROLE_KEY}
  local-storage-path: ${LOCAL_STORAGE_PATH:./storage}
  bucket-public: ${SUPABASE_BUCKET_PUBLIC:uploads-public}
  bucket-private: ${SUPABASE_BUCKET_PRIVATE:uploads-private}
  bucket-invoices: ${SUPABASE_BUCKET_INVOICES:data}
  connect-timeout-ms: ${SUPABASE_CONNECT_TIMEOUT_MS:5000}
  request-timeout-ms: ${SUPABASE_REQUEST_TIMEOUT_MS:15000}
  retry-max-attempts: ${SUPABASE_RETRY_MAX_ATTEMPTS:2}
  retry-backoff-ms: ${SUPABASE_RETRY_BACKOFF_MS:500}

logging:
  level:
    root: INFO
    com.nexxserve.nexxclinic: INFO
    org.hibernate.SQL: WARN

# ── Actuator ────────────────────────────────────────────────────────────────
# Only expose health + info. Lock down everything else (env, beans, configprops
# would leak internal config if exposed).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── JWT ─────────────────────────────────────────────────────────────────────
# In production, JWT_SECRET MUST be set via env var. No fallback default
# — the app will refuse to start if it's missing.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
