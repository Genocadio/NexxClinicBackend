spring:
  datasource:
    url: jdbc:h2:mem:nexxclinic-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # H2 tests keep Hibernate-managed schema; the Postgres-only Flyway
      # migrations are not applicable here.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

meilisearch:
  # Tests run without a Meilisearch instance; search falls back to the database.
  enabled: false

app:
  jwt:
    secret: test-secret-value-with-at-least-32-bytes-long
    expiration-minutes: 120
    refresh-expiration-days: 14
  password:
    history-count: 5
